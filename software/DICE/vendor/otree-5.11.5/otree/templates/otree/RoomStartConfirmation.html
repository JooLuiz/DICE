{% extends "otree/Base.html" %}

{% block body_main %}
  <div class="container">
    <div class="card mt-5 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3">{{ room.display_name }}</h1>
        <p>{{ start_message }}</p>
        <form method="post" action="/room/{{ room_name }}?participant_label={{ participant_label }}&hash={{ secure_hash }}">
          <button class="btn btn-primary" type="submit">{{ start_button_label }}</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
